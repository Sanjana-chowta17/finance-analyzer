server:
  port: 8080

spring:
  application:
    name: finance-backend

  datasource:
    url: jdbc:mysql://localhost:3306/finance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-bytes-long}
    expiration-ms: 86400000

  cors:
    allowed-origins: [http://localhost:5173]

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta