server:
  port: ${PORT:8080}

spring:
  application:
    name: finance-backend

  datasource:
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:finance_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQLUSER:${DB_USERNAME:root}}
    password: ${MYSQLPASSWORD:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-bytes-long}
    expiration-ms: 86400000

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta